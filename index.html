<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Autenticação Supabase</title>
  <link rel="stylesheet" href="index.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">

    <div id="login-card" class="card">
      <div class="header">
        <div class="badge">Supabase Auth</div>
        <h1>Entrar na Conta</h1>
        <p>Preencha seus dados para acessar</p>
      </div>

      <div id="login-alert" class="alert hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input
            type="email"
            id="login-email"
            placeholder="seu.email@exemplo.com"
            value="teste@gmail.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="login-password">Senha</label>
          <input
            type="password"
            id="login-password"
            placeholder="••••••••"
            value="0000"
            required
          />
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary">
          Entrar
        </button>
      </form>

      <div class="switch-text">
        Não tem uma conta? <a id="to-register">Cadastrar</a>
      </div>
    </div>

    <div id="register-card" class="card hidden">
      <div class="header">
        <div class="badge">Novo Usuário</div>
        <h1>Criar Conta</h1>
        <p>Cadastre-se no banco de dados</p>
      </div>

      <div id="register-alert" class="alert hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="register-email">E-mail</label>
          <input
            type="email"
            id="register-email"
            placeholder="seu.email@exemplo.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-password">Senha</label>
          <input
            type="password"
            id="register-password"
            placeholder="Mínimo 6 caracteres"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-confirm">Confirmar Senha</label>
          <input
            type="password"
            id="register-confirm"
            placeholder="Repita a senha"
            required
          />
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary">
          Cadastrar
        </button>
      </form>

      <div class="switch-text">
        Já tem uma conta? <a id="to-login">Fazer Login</a>
      </div>
    </div>

    <div id="welcome-card" class="card hidden" style="text-align: center;">
      <div class="header">
        <div class="badge">Autenticado</div>
        <h1>Bem-vindo!</h1>
        <p>Você está conectado com sucesso no sistema.</p>
      </div>

      <div class="user-info">
        <p><strong>E-mail:</strong> <span id="welcome-email"></span></p>
        <p><strong>ID do Usuário:</strong> <span id="welcome-id" style="font-family: monospace; font-size: 11px;"></span></p>
      </div>

      <button id="logout-btn" class="btn btn-secondary">
        Sair (Sign Out)
      </button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
